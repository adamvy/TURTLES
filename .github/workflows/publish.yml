name: Publish verified release and website
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-turtles-release
  cancel-in-progress: false
jobs:
  package:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y qemu-system-arm clang
      - run: npm test
      - run: node tools/browser-engine.mjs && npm run test:wasm
      - run: npm run build:web && node test/site-package.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: build/release/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: validation
          path: |
            build/*transcript*
            build/full-conformance-results.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  release:
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release
      - name: Publish permanent image downloads
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release exists; checking that assets are immutable.'
            mkdir existing
            gh release download "$RELEASE_TAG" --dir existing
            diff -r release existing
          else
            gh release create "$RELEASE_TAG" release/* --verify-tag --title "Turtles ARM/browser $RELEASE_TAG" --notes-file docs/RELEASE.md
          fi
  deploy:
    needs: [package, release]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
